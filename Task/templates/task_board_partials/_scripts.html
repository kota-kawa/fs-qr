<script>
  async function copyTextToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        return;
      } catch (err) {
        console.error('Clipboard API failed, falling back to execCommand', err);
      }
    }

    const textarea = document.createElement('textarea');
    textarea.value = text;
    Object.assign(textarea.style, {
      position: 'fixed',
      top: '0',
      left: '-9999px',
      width: '2em',
      height: '2em',
      padding: '0',
      border: 'none',
      outline: 'none',
      boxShadow: 'none',
      background: 'transparent',
      opacity: '0',
      pointerEvents: 'none'
    });

    textarea.setAttribute('readonly', '');
    document.body.appendChild(textarea);

    try {
      textarea.select();
      if (typeof textarea.focus === 'function') {
        textarea.focus({ preventScroll: true });
      }
      if (!document.execCommand('copy')) {
        throw new Error('execCommand copy failed');
      }
    } finally {
      document.body.removeChild(textarea);
    }
  }

  let shareFeedbackTimer = null;
  function setShareFeedback(message, kind) {
    const feedback = document.getElementById('shareFeedback');
    if (!feedback) {
      return;
    }
    feedback.textContent = message;
    feedback.className = `share-feedback is-visible is-${kind}`;
    if (shareFeedbackTimer) {
      clearTimeout(shareFeedbackTimer);
    }
    shareFeedbackTimer = setTimeout(() => {
      feedback.classList.remove('is-visible');
      shareFeedbackTimer = null;
    }, 4000);
  }

  function translate(key, fallback) {
    if (window.FSQR_I18N && typeof window.FSQR_I18N.t === 'function') {
      return window.FSQR_I18N.t(key, fallback);
    }
    return fallback || key;
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.copy-url-button').forEach((button) => {
      button.addEventListener('click', async () => {
        const text = button.getAttribute('data-copy-value') || '';
        if (!text) {
          return;
        }

        const defaultLabel = button.getAttribute('data-default-label') || translate('common.copy', 'コピー');
        const copiedLabel = button.getAttribute('data-copied-label') || translate('common.copied', 'コピー済み');

        try {
          await copyTextToClipboard(text);
          button.classList.add('copied');
          button.setAttribute('aria-label', copiedLabel);
          button.setAttribute('title', copiedLabel);
          setShareFeedback(translate('share.copied_to_clipboard', 'クリップボードにコピーしました。'), 'success');
          setTimeout(() => {
            button.classList.remove('copied');
            button.setAttribute('aria-label', defaultLabel);
            button.setAttribute('title', defaultLabel);
          }, 2000);
        } catch (error) {
          setShareFeedback(translate('share.copy_manual_error', 'コピーに失敗しました。手動でコピーしてください。'), 'error');
        }
      });
    });

    document.querySelectorAll('.share-url-button').forEach((button) => {
      button.addEventListener('click', async () => {
        const url = button.getAttribute('data-share-url') || '';
        if (!url) {
          return;
        }
        const title = button.getAttribute('data-share-title') || document.title;
        if (navigator.share) {
          try {
            await navigator.share({ title: title, url: url });
          } catch (error) {
            if (error && error.name === 'AbortError') {
              return;
            }
            console.error('Error sharing:', error);
          }
          return;
        }
        try {
          await copyTextToClipboard(url);
          setShareFeedback(translate('share.copied_to_clipboard', 'URLをコピーしました。貼り付けて共有できます。'), 'success');
        } catch (error) {
          setShareFeedback(translate('share.copy_manual_error', 'コピーに失敗しました。URLを表示して手動でコピーしてください。'), 'error');
        }
      });
    });
  });
</script>

<script src="{{ staticfile('qrcode.min.js') }}"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const qrContainer = document.getElementById('taskShareQrCode');
    const shareUrl = qrContainer ? qrContainer.getAttribute('data-share-url') : '';
    if (!qrContainer || !shareUrl || typeof QRCode !== 'function') {
      return;
    }
    qrContainer.innerHTML = '';
    new QRCode(qrContainer, {
      text: shareUrl,
      width: 160,
      height: 160,
      correctLevel: QRCode.CorrectLevel.M
    });
  });
</script>
