{% extends "task_layout.html" %}
{% block page_title %}タスクボードを作成 | FS!QR Task{% endblock %}{% block meta_robots %}noindex, follow{% endblock %}
{% block contents %}<div class="modern-page-container"><form class="modern-content-card modern-form" method="post" action="/create_task_room"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="modern-card-header"><h1>タスクボードを作成</h1></div><div class="modern-card-body"><p>ルームIDは自動生成されます。手動で指定することもできます。</p><label class="modern-form-label"><input type="radio" name="idMode" value="auto" checked> 自動生成</label><label class="modern-form-label"><input type="radio" name="idMode" value="manual"> 手動入力</label><label class="modern-form-label" for="task-room-id">ルームID（手動の場合）</label><input class="modern-form-input" id="task-room-id" name="id" minlength="6" maxlength="6" pattern="[a-zA-Z0-9]{6}" placeholder="6文字の半角英数字"><label class="modern-form-label" for="task-retention">自動削除までの期間</label><select class="retention-select" id="task-retention" name="retention_hours"><option value="1">1時間</option><option value="6">6時間</option><option value="12">12時間</option><option value="24" selected>24時間（デフォルト）</option></select><button class="modern-btn modern-btn--primary" type="submit">ボードを作成</button></div></form></div>{% endblock %}
