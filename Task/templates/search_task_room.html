{% extends "task_layout.html" %}
{% block page_title %}タスクボードに参加 | FS!QR Task{% endblock %}{% block meta_robots %}noindex, nofollow{% endblock %}
{% block contents %}<div class="modern-page-container"><form class="modern-content-card modern-form" method="post" action="/search_task_process"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="modern-card-header"><h1>タスクボードに参加</h1></div><div class="modern-card-body"><label class="modern-form-label" for="task-join-id">ルームID</label><input class="modern-form-input" id="task-join-id" name="id" required minlength="6" maxlength="6" pattern="[a-zA-Z0-9]{6}" autocomplete="off"><label class="modern-form-label" for="task-join-password">パスワード</label><input class="modern-form-input" id="task-join-password" name="password" type="password" required minlength="6" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="current-password"><button class="modern-btn modern-btn--primary" type="submit">ルームに参加</button></div></form></div>{% endblock %}
