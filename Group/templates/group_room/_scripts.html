{% import "macros/icons.html" as icons %}
<script src="{{staticfile('qrcode.min.js')}}"></script>
<script src="{{staticfile('js/shared/app-namespace.js')}}"></script>
<script src="{{staticfile('js/shared/runtime-helpers.js')}}"></script>

<!-- Copy / share / QR behaviour is shared with FSQR, Note and Task. -->
<!-- コピー・共有・QR の挙動は FSQR / Note / Task と共通のモジュールに集約している。 -->
<script src="{{staticfile('js/shared/share-panel.js')}}"></script>
<script nonce="{{ csp_nonce }}">
    window.__FSQR_APP__.api.getShared('sharePanel').init();
</script>

<script nonce="{{ csp_nonce }}">
    window.__FSQR_APP__.api.setConfig('groupRoom', Object.freeze({
        roomId: {{ room_id|string|tojson }},
        websocketCsrfToken: {{ websocket_csrf_token|string|tojson }},
        debug: {{ frontend_debug | tojson }},
        limits: Object.freeze(
            Object.assign(
                {},
                (((window.AppConfig || {}).limits || {}).upload || {}),
                (((window.AppConfig || {}).limits || {}).group || {})
            )
        ),
        icons: Object.freeze({
            file: {{ icons.icon('document', size='lg', extra_classes='modern-file-icon') | tojson }},
            preview: {{ icons.icon('search', size='lg') | tojson }},
            download: {{ icons.icon('arrow_down', size='lg') | tojson }},
            trash: {{ icons.icon('trash', size='lg') | tojson }},
            cloud: {{ icons.icon('cloud', size='xxl') | tojson }},
            check: {{ icons.icon('check_circle', size='xxl') | tojson }},
            rocket: {{ icons.icon('rocket', size='lg', with_text=True) | tojson }}
        })
    }));
</script>
<script src="{{staticfile('js/shared/upload-validation.js')}}"></script>
<script src="{{staticfile('js/shared/file-tray.js')}}"></script>
<script src="{{staticfile('js/shared/progress-spinner.js')}}"></script>
<script src="{{staticfile('js/group_room/core.js')}}"></script>
<script src="{{staticfile('js/group_room/preview.js')}}"></script>
<script src="{{staticfile('js/group_room/downloads.js')}}"></script>
<script src="{{staticfile('js/group_room/remote-files.js')}}"></script>
<script src="{{staticfile('js/group_room/upload-queue.js')}}"></script>
<script src="{{staticfile('js/group_room/upload-submit.js')}}"></script>
<script src="{{staticfile('js/group_room/main.js')}}"></script>
